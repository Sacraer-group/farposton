name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .:src
      PYTHONUTF8: '1'
      LOG_FILE: logs/ci.log
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r web/requirements.txt pytest
      - name: Run project tests with an offline calendar
        run: make test
      - name: Verify synthetic analytics and causal comparison
        run: |
          demo_root=$(mktemp -d "$RUNNER_TEMP/forecast-demo.XXXXXX")
          trap 'rm -rf "$demo_root"' EXIT
          tar -xzf demo/forecast-demo-data.tar.gz -C "$demo_root"
          .venv/bin/python demo/check_analytics.py "$demo_root/forecast"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://farposton.renosaza.com
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build the tested release
        run: |
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "farposton:release-$GITHUB_SHA" .
      - name: Deploy current main through restricted SSH
        env:
          GH_TOKEN: ${{ github.token }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo "Skipping a superseded main release."
            exit 0
          fi
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/farposton-ssh.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          docker save "farposton:release-$GITHUB_SHA" | gzip -1 | \
            ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
              -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              -i "$ssh_dir/key" "farposton-ci@$PROD_HOST" "deploy $GITHUB_SHA"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://farposton.renosaza.com/health
