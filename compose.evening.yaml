services:
  evening:
    build:
      context: .
      dockerfile: Dockerfile.evening
    ports:
      - "127.0.0.1:18447:18447"
    environment:
      DEPLOYMENT_PROFILE: local
      WEB_DEMO_NO_AUTH: "1"
      WEB_HOST: 0.0.0.0
      WEB_PORT: "18447"
      EVENING_DEMO_DIR: /app/.demo/evening
      EVENING_DB_PATH: /app/.demo/evening/plans.sqlite3
    volumes:
      - evening_state:/app/.demo/evening
    user: "10001:10001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18447/api/evening/events"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  evening_state:
