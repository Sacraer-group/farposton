<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Вход — Прогноз заказов</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<script>
/* Тема ставится ДО отрисовки (тот же ключ, что у app.js) — страница входа
   самодостаточна и не зависит от /assets. */
(function () {
  var t = null;
  try { t = localStorage.getItem('app_theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark')
    t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
  /* Токены оформления страницы входа. */
  :root{
    color-scheme:light;
    --paper:#FFFFFF;  --wash:#F8F6F3;
    --ink:#141414;    --ink2:#3A3A3A;   --mut:#6E6E6E;
    --line:#E8E4E0;   --line2:#D8D3CF;
    --accent:#315A85; --accent-dark:#25486C; --accent-soft:#EAF1F8;
    --amber:#B26B00;  --amber-soft:#FDF3E2;
    --green:#2E7D4F;  --green-soft:#E9F4EE;
    --info:#2B5FA3;   --info-soft:#EAF1FB;
    --row-alt:#FBFAF8;
    --grid-line:transparent;
    --shadow:0 10px 30px rgba(20,20,20,.05);
    --seg-on-bg:#141414; --seg-on-ink:#FFFFFF;
    --radius:14px;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --paper:#1C1C1F;  --wash:#141416;
    --ink:#F1EFEC;    --ink2:#C9C6C1;   --mut:#918D88;
    --line:#2A2A2E;   --line2:#3B3B41;
    --accent:#91B8E8; --accent-dark:#B6D0EF; --accent-soft:#1C3148;
    --amber:#E0A458;  --amber-soft:#332818;
    --green:#5CB985;  --green-soft:#1C2F25;
    --info:#8FB4E8;   --info-soft:#1C2A3E;
    --row-alt:#202023;
    --grid-line:transparent;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --seg-on-bg:#F1EFEC; --seg-on-ink:#141416;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--ink); line-height:1.45;

    background:var(--wash);
    display:flex; align-items:center; justify-content:center; padding:24px 24px 72px;
  }
  .card{
    width:100%; max-width:400px; background:var(--paper); border:1px solid var(--line);
    border-radius:var(--radius); padding:30px 28px 26px;
    box-shadow:var(--shadow);

  }
  .back-link{display:inline-block;color:var(--accent);font-size:13px;margin-bottom:14px;text-underline-offset:3px}
  .back-link:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
  .brand{text-align:center; margin-bottom:4px}
  .serial-plate{display:block;width:148px;height:72px;object-fit:cover;object-position:50% 36%;margin:0 auto;border-radius:4px}
  .service{font-size:15px; font-weight:600; margin-top:6px; color:var(--ink)}
  .rule{height:1px; background:var(--line); margin:20px 0 4px}
  label{display:block; font-size:13px; color:var(--mut); margin:16px 0 7px}
  input[type=password],input[type=text]{
    width:100%; padding:12px 13px; font-size:15px; color:var(--ink);
    background:var(--paper); border:1px solid var(--line2); border-radius:10px; outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  input[type=password]:focus,input[type=text]:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  button{
    width:100%; margin-top:20px; padding:12px; font-size:15px; font-weight:600; cursor:pointer;
    color:#fff; background:var(--accent); border:0; border-radius:10px;
    transition:background .15s, transform .05s;
  }
  button:hover{background:var(--accent-dark)}
  :root[data-theme="dark"] button{color:#141416}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.55; cursor:default}
  .err{margin-top:14px; color:#C54444; font-size:13px; min-height:18px}
  .foot{margin-top:18px; color:var(--mut); font-size:11.5px; text-align:center; line-height:1.55}
</style>
</head>
<body>
  <form class="card" id="form" autocomplete="off">
    <a class="back-link" href="/about">О проекте Forecast</a>
    <div class="brand"><img class="serial-plate" src="/assets/serial-plate.png" alt="SERIAL NO.">
      
      
      <div class="service">Прогноз заказов</div>
    </div>
    <div class="rule"></div>
    <label for="username">Логин</label>
    <input type="text" id="username" name="username" required autocomplete="username" autofocus>
    <label for="pwd">Пароль</label>
    <input type="password" id="pwd" name="password" required autocomplete="current-password">
    <button type="submit" id="btn">Войти</button>
    <div class="err" id="err" role="alert" aria-live="polite"></div>
    <div class="foot">Демонстрационные данные</div>
  </form>

<script>
  const form = document.getElementById('form');
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true; btn.textContent = 'Проверяю…';
    try {
      const r = await fetch('/login', {
        method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body: new URLSearchParams({username: document.getElementById('username').value, password: document.getElementById('pwd').value}),
      });
      const data = await r.json().catch(() => ({}));
      if (r.ok && data.ok) { window.location = data.redirect || '/'; return; }
      err.textContent = data.message || 'Не удалось войти.';
    } catch (_) {
      err.textContent = 'Сеть недоступна. Попробуйте ещё раз.';
    } finally {
      btn.disabled = false; btn.textContent = 'Войти';
    }
  });
</script>
</body>
</html>
