<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Сводки — Прогноз заказов</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css?v=20260929-ui4">
<script src="/assets/app.js?v=20260929-ui4"></script>
<style>
  /* Специфика страницы «Сводки»: список дат слева, сводка справа */
  .reports-layout{display:grid;grid-template-columns:220px 1fr;gap:0;min-height:420px}
  .rep-dates{border-right:1px solid var(--line);padding:10px 0;overflow-y:auto;max-height:78vh}
  .rep-date{display:block;width:100%;text-align:left;background:transparent;border:0;
    cursor:pointer;padding:10px 16px;font-size:13.5px;color:var(--ink2);
    font-family:inherit;border-left:3px solid transparent}
  .rep-date:hover{background:var(--wash)}
  .rep-date.active{background:var(--accent-soft);border-left-color:var(--accent);
    color:var(--ink);font-weight:600}
  .rep-date .d{white-space:nowrap}
  .rep-date .pill{margin-top:4px}
  .rep-view{padding:0;min-width:0}
  .rep-view iframe{display:block;width:100%;border:0;min-height:420px;background:var(--paper);
    border-radius:0 0 var(--radius) 0}
  .rep-empty{padding:40px 24px;color:var(--mut);font-size:14px;text-align:center}
  .rep-loading{padding:40px 24px;color:var(--mut);font-size:13.5px;text-align:center}
  @media (max-width:720px){
    .reports-layout{grid-template-columns:1fr}
    .rep-dates{border-right:0;border-bottom:1px solid var(--line);max-height:180px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><a href="/" aria-label="На главную"><img class="serial-plate" src="/assets/serial-plate.png" alt="SERIAL NO."></a>
      
      <div class="service">Прогноз заказов<div class="sub">готовая еда · кухня → точки</div></div>
    </div>
    <div class="hdr-actions">
      <button class="ghost icon" onclick="toggleTheme()" aria-label="Переключить тему">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor" aria-hidden="true">
          <g class="ic-sun"><circle cx="10" cy="10" r="4.4"/><path d="M10 0v3M10 17v3M0 10h3M17 10h3M2.9 2.9l2.1 2.1M15 15l2.1 2.1M17.1 2.9L15 5M5 15l-2.1 2.1" stroke="currentColor" stroke-width="1.6" fill="none"/></g>
          <path class="ic-moon" d="M17 12.5A7.5 7.5 0 0 1 7.5 3a7.5 7.5 0 1 0 9.5 9.5z"/>
        </svg>
      </button>
      <button class="ghost" id="logoutBtn" onclick="logout()">Выйти</button>
    </div>
  </header>

  <nav class="tabs">
    <a class="tab" href="/">Заявка </a>
      <a class="tab" href="/accuracy" data-admin-only>Точность </a>
      <a class="tab" href="/comparison" data-admin-only>Сравнение </a>
      <a class="tab" href="/analytics" data-admin-only>Аналитика </a>
    <a class="tab active" href="/reports">Сводки </a>
    <a class="tab" href="/chat">Помощник </a>
  </nav>

  <div class="card" style="padding:0;overflow:hidden">
    <div class="reports-layout">
      <aside class="rep-dates" id="dates">
        <div class="rep-loading">Загрузка списка…</div>
      </aside>
      <section class="rep-view" id="view">
        <div class="rep-loading">Загрузка сводки…</div>
      </section>
    </div>
  </div>

  <div class="footnote">
    Утренние сводки собирает дневной конвейер: числа считаются кодом, текст (когда включён
    ключ ИИ) — помощником по готовым числам. Демонстрационный сервис прогноза.
  </div>
  
</div>

<script>
'use strict';
(function () {
  const datesBox = document.getElementById('dates');
  const viewBox = document.getElementById('view');
  let reports = [];        // [{date, has_llm_text}] — свежие первыми (порядок сервера)
  let current = null;
  let currentHtml = null;  // html открытой сводки — чтобы перекрасить при смене темы
  let requestId = 0;

  /** '2026-08-11' → '11.08.2026' */
  function dmY(iso) { return iso.slice(8, 10) + '.' + iso.slice(5, 7) + '.' + iso.slice(0, 4); }

  function renderList() {
    datesBox.textContent = '';
    if (!reports.length) {
      datesBox.append(el('div', { class: 'rep-empty', text: 'Сводок пока нет' }));
      return;
    }
    reports.forEach(r => {
      const btn = el('button', {
        class: 'rep-date' + (r.date === current ? ' active' : ''),
        type: 'button', 'data-date': r.date,
      }, [el('span', { class: 'd', text: dmY(r.date) })]);
      if (!r.has_llm_text) {
        btn.append(el('div', {}, [el('span', { class: 'pill', text: 'без текста ИИ' })]));
      }
      btn.addEventListener('click', () => select(r.date));
      datesBox.append(btn);
    });
  }

  /** Сводка — автономный html; тему родителя прокидываем атрибутом на её <html>. */
  function themed(html) {
    const t = document.documentElement.dataset.theme || 'light';
    return html.replace('<html', '<html data-theme="' + t + '"');
  }

  function showHtml(html) {
    currentHtml = html || null;
    viewBox.textContent = '';
    if (!html) {
      viewBox.append(el('div', { class: 'rep-empty', text: 'У этой сводки нет html-версии.' }));
      return;
    }
    const frame = el('iframe', { sandbox: 'allow-same-origin', title: 'Утренняя сводка' });
    frame.addEventListener('load', () => {
      // srcdoc same-origin: подгоняем высоту под содержимое, чтобы не было двойного скролла
      try {
        const h = frame.contentDocument.documentElement.scrollHeight;
        frame.style.height = Math.max(420, h + 30) + 'px';
      } catch (e) { /* высота останется дефолтной */ }
    });
    frame.srcdoc = themed(html);
    viewBox.append(frame);
  }

  // Переключили тему на странице — перекрашиваем и открытую сводку
  document.addEventListener('app-theme', () => {
    const frame = viewBox.querySelector('iframe');
    if (frame && currentHtml) frame.srcdoc = themed(currentHtml);
  });

  async function select(date) {
    const id = ++requestId;
    current = date;
    currentHtml = null;
    renderList();
    viewBox.textContent = '';
    viewBox.append(el('div', { class: 'rep-loading', text: 'Загрузка сводки…' }));
    try {
      const d = await fetchJSON('/api/reports/' + encodeURIComponent(date));
      if (id !== requestId) return;
      showHtml(d.html);
    } catch (e) {
      if (id !== requestId) return;
      viewBox.textContent = '';
      viewBox.append(el('div', { class: 'rep-empty', text: 'Не удалось загрузить сводку: ' + e.message }));
    }
  }

  async function init() {
    try {
      reports = await fetchJSON('/api/reports');
    } catch (e) {
      datesBox.textContent = '';
      datesBox.append(el('div', { class: 'rep-empty', text: 'Ошибка списка: ' + e.message }));
      viewBox.textContent = '';
      return;
    }
    renderList();
    if (reports.length) {
      // Первая загрузка — самая свежая сводка
      select(reports[0].date);
    } else {
      viewBox.textContent = '';
      viewBox.append(el('div', { class: 'rep-empty',
        text: 'Сводок пока нет — они появятся после первого утреннего прогона.' }));
    }
  }

  init();
})();
</script>
</body>
</html>
