<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Готовый вечер</title>
  <style>
    :root { --bg:#f6f4ef; --card:#fff; --text:#1f2937; --muted:#6b7280; --accent:#0f766e; --err:#b91c1c; --warn:#92400e; --border:#d1d5db; }
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.4}
    main{max-width:860px;margin:0 auto;padding:16px} h1{margin:0 0 8px;font-size:1.6rem}
    .notice{background:#fff7ed;border:1px solid #fdba74;padding:10px 12px;border-radius:10px;margin:10px 0}
    .notice.real{background:#ecfeff;border-color:#67e8f9}
    .warn{background:#fffbeb;border:1px solid #fcd34d;color:var(--warn);padding:10px 12px;border-radius:10px;margin:10px 0}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin:12px 0}
    label{display:block;font-weight:600;margin:10px 0 4px} input,select,button{font:inherit}
    input[type=text],input[type=time],input[type=number],input[type=date],select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px} @media(max-width:640px){.row{grid-template-columns:1fr}}
    fieldset{border:1px solid var(--border);border-radius:10px;padding:10px;margin:10px 0} legend{font-weight:600;padding:0 6px}
    .checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px}
    .checks label{font-weight:500;margin:0;display:flex;gap:8px;align-items:flex-start}
    button.primary{background:var(--accent);color:#fff;border:none;padding:11px 14px;border-radius:10px;cursor:pointer;font-weight:600}
    button.secondary{background:#eef2f7;color:var(--text);border:1px solid var(--border);padding:9px 12px;border-radius:10px;cursor:pointer}
    button:focus,input:focus,select:focus,a:focus{outline:3px solid #99f6e4;outline-offset:1px}
    .error{color:var(--err);margin:8px 0} .muted{color:var(--muted)} .hidden{display:none}
    .result h2{margin-top:0} .pill{display:inline-block;background:#ecfeff;border:1px solid #99f6e4;border-radius:999px;padding:2px 8px;margin:2px 4px 2px 0;font-size:.9rem}
    .plan-block{border-top:1px solid var(--border);padding-top:10px;margin-top:10px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    a{color:var(--accent)} .small{font-size:.92rem}
  </style>
</head>
<body>
<main>
  <h1>Готовый вечер</h1>
  <div id="mode-notice" class="notice"></div>
  <div id="mode-warning" class="warn hidden"></div>

  <section class="card" aria-labelledby="form-title">
    <h2 id="form-title">Параметры вечера</h2>
    <div id="loading" class="muted">Загрузка событий…</div>
    <div id="load-error" class="error hidden" role="alert"></div>
    <form id="plan-form" class="hidden">
      <label for="event">Событие</label>
      <select id="event" name="event_id" required></select>
      <div id="event-meta" class="muted small"></div>
      <div class="row">
        <div>
          <label for="date">Дата (Asia/Vladivostok)</label>
          <input id="date" name="date" type="date" required>
        </div>
        <div>
          <label for="max_distance_m">Макс. расстояние, м (100–5000)</label>
          <input id="max_distance_m" name="max_distance_m" type="number" min="100" max="5000" step="1" value="2000" required>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="meal_start">Начало еды (HH:MM)</label>
          <input id="meal_start" name="meal_start" type="time" required>
        </div>
        <div>
          <label for="meal_end">Конец еды (HH:MM, не позже начала события)</label>
          <input id="meal_end" name="meal_end" type="time" required>
        </div>
      </div>
      <fieldset>
        <legend>Обязательные признаки (max 5, только подтверждённые)</legend>
        <div class="checks" id="required_features"></div>
      </fieldset>
      <fieldset>
        <legend>Предпочтения (max 5, без пересечения с обязательными)</legend>
        <div class="checks" id="preferred_features"></div>
      </fieldset>
      <div id="form-error" class="error hidden" role="alert"></div>
      <div class="actions">
        <button type="submit" class="primary" id="submit-btn">Подобрать план</button>
      </div>
    </form>
  </section>

  <section id="result" class="card result hidden" aria-live="polite"></section>
</main>
<script>
const FEATURES = [
  ['dog','Можно с собакой'],
  ['laptop','Можно с ноутбуком'],
  ['children','Детское меню'],
  ['terrace','Летняя веранда / столики на улице'],
  ['reservations','Заказ столиков (не подтверждённая бронь)']
];
let events = [];
let eventsMeta = {synthetic:true};
const $ = (id) => document.getElementById(id);

function renderFeatureChecks(containerId, name) {
  const el = $(containerId);
  el.innerHTML = FEATURES.map(([v,l]) => `<label><input type="checkbox" name="${name}" value="${v}"> <span>${l}</span></label>`).join('');
}
function showError(id, msg) { const e=$(id); e.textContent=msg; e.classList.toggle('hidden', !msg); }
function setLoading(on) { $('submit-btn').disabled = on; $('submit-btn').textContent = on ? 'Подбираем…' : 'Подобрать план'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function safeLink(url){ if(typeof url==='string' && /^https:\/\//i.test(url)) return url; return null; }
function fmtDateTime(iso){ try { return new Date(iso).toLocaleString('ru-RU', {timeZone:'Asia/Vladivostok', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}); } catch { return iso||''; } }

function optionLabel(ev) {
  const d = ev.starts_at ? fmtDateTime(ev.starts_at) : ev.date;
  const venue = ev.venue_name ? ` — ${ev.venue_name}` : '';
  return `${ev.title}${venue} — ${d} (Asia/Vladivostok)`;
}

function updateEventMeta() {
  const opt = $('event').selectedOptions[0];
  const ev = events.find(e=>e.id===opt?.value);
  if (!ev) { $('event-meta').innerHTML=''; return; }
  const parts = [];
  if (ev.venue_name) parts.push(`<div><strong>Площадка:</strong> ${esc(ev.venue_name)}</div>`);
  if (ev.starts_at) parts.push(`<div><strong>Время:</strong> ${esc(fmtDateTime(ev.starts_at))} (Asia/Vladivostok)</div>`);
  if (ev.source_name || ev.source_url) {
    const url = safeLink(ev.source_url);
    const name = esc(ev.source_name || 'Источник');
    parts.push(`<div><strong>Источник:</strong> ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${name}</a>` : name}</div>`);
  }
  if (ev.checked_at) parts.push(`<div><strong>Проверено:</strong> ${esc(fmtDateTime(ev.checked_at))}</div>`);
  if (ev.warning) parts.push(`<div class="error">${esc(ev.warning)}</div>`);
  $('event-meta').innerHTML = parts.join('');
}

function setModeNotice(meta){
  const n = $('mode-notice');
  if (meta.synthetic) {
    n.className = 'notice';
    n.innerHTML = '<strong>Вымышленное демо.</strong> События и места синтетические. Наличие столов не проверено. Минуты пути и гарантии мест не показываются.';
  } else {
    n.className = 'notice real';
    n.innerHTML = '<strong>Реальные данные.</strong> Каталог — снимок 2ГИС-карточек; синтетическая загруженность не используется. События — ручная проверенная подборка. Факт наличия столов и статусы билетов не проверены. Сезонная доступность террас не проверяется.';
  }
  const w = $('mode-warning');
  if (meta.warning) { w.textContent = meta.warning; w.classList.remove('hidden'); } else { w.textContent=''; w.classList.add('hidden'); }
}

async function loadEvents() {
  try {
    const r = await fetch('/api/evening/events', {credentials:'same-origin'});
    const data = await r.json().catch(()=>({}));
    if (!r.ok) throw data;
    eventsMeta = data;
    setModeNotice(data);
    events = data.items || [];
    const sel = $('event');
    if (!events.length) {
      sel.innerHTML = '<option value="">Нет доступных событий</option>';
    } else {
      sel.innerHTML = events.map(ev => `<option value="${esc(ev.id)}" data-date="${esc(ev.date||'')}">${esc(optionLabel(ev))}</option>`).join('');
    }
    if (events[0] && events[0].date) $('date').value = events[0].date;
    updateEventMeta();
    $('loading').classList.add('hidden');
    $('plan-form').classList.toggle('hidden', !events.length);
    if (!events.length) showError('load-error', data.warning || 'Нет доступных событий для построения плана.');
  } catch (e) {
    $('loading').classList.add('hidden');
    const msg = e?.detail?.message || e?.message || 'Не удалось загрузить события';
    showError('load-error', msg);
  }
}

$('event').addEventListener('change', () => {
  const opt = $('event').selectedOptions[0];
  if (opt && opt.dataset.date) $('date').value = opt.dataset.date;
  updateEventMeta();
});

function pills(arr, label) {
  if (!arr || !arr.length) return `<div><span class="muted">${esc(label)}: нет</span></div>`;
  const names = {dog:'Можно с собакой', laptop:'Можно с ноутбуком', children:'Детское меню', terrace:'Летняя веранда / столики на улице', reservations:'Заказ столиков'};
  return `<div><strong>${esc(label)}:</strong> ${arr.map(x=>`<span class="pill">${esc(names[x]||x)}</span>`).join(' ')}</div>`;
}

function renderPlace(title, place) {
  if (!place) return '';
  const addr = place.address ? `<div class="muted small">${esc(place.address)}</div>` : '';
  const meta = [];
  if (typeof place.rating === 'number') meta.push(`рейтинг ${place.rating}`);
  if (typeof place.review_count === 'number') meta.push(`отзывов ${place.review_count}`);
  return `<div class="plan-block"><h3>${esc(title)}</h3>
    <p><strong>${esc(place.name)}</strong> (${esc(place.category||'')})</p>
    ${addr}
    <p>Расстояние от площадки события: ${esc(place.distance_m)} м${meta.length?` · ${esc(meta.join(', '))}`:''}</p>
    ${pills(place.confirmed,'Подтверждённые признаки')}
    ${pills(place.matched_preferred,'Совпавшие предпочтения')}
    ${pills(place.unknown,'Неизвестно')}
  </div>`;
}

function renderSources(plan){
  const items = (plan.sources||[]).map(s=>{
    const url = safeLink(s.url);
    const name = url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(s.name||'Источник')}</a>` : esc(s.name||'Источник');
    const checked = s.checked_at ? `, проверено: ${esc(fmtDateTime(s.checked_at))}` : '';
    const note = s.note ? ` — ${esc(s.note)}` : '';
    return `<li>${name}${checked}${note}</li>`;
  }).join('');
  return `<ul class="small">${items}</ul>`;
}

function renderResult(plan) {
  const url = `${location.origin}/evening/p/${plan.id}`;
  const ev = plan.event || {};
  const evParts = [];
  if (ev.venue_name) evParts.push(`<div><strong>Площадка:</strong> ${esc(ev.venue_name)}</div>`);
  const src = safeLink(ev.source_url);
  if (ev.source_name || src) evParts.push(`<div><strong>Источник события:</strong> ${src ? `<a href="${esc(src)}" target="_blank" rel="noopener noreferrer">${esc(ev.source_name||'Источник')}</a>` : esc(ev.source_name)}</div>`);
  if (ev.checked_at) evParts.push(`<div><strong>Проверено:</strong> ${esc(fmtDateTime(ev.checked_at))}</div>`);
  const warn = plan.warning || ev.warning || (plan.current && plan.current.stale ? 'Данные источника могли устареть.' : '');
  $('result').innerHTML = `
    <h2>Результат ${plan.synthetic ? '(вымышленное демо)' : '(реальные данные)'}</h2>
    ${warn ? `<div class="warn">${esc(warn)}</div>` : ''}
    <p><strong>Событие:</strong> ${esc(ev.title || '')} — ${esc(ev.starts_at ? fmtDateTime(ev.starts_at) : '')} (Asia/Vladivostok)</p>
    ${evParts.join('')}
    <p><strong>Окно еды:</strong> ${esc(plan.request.meal_start)}–${esc(plan.request.meal_end)}, дата ${esc(plan.request.date)} (Asia/Vladivostok)</p>
    ${renderPlace('Основной вариант', plan.primary)}
    ${renderPlace('План Б', plan.alternative)}
    <div class="plan-block">
      <p class="muted">${esc(plan.disclaimer || '')}</p>
      <p><strong>Источники:</strong></p>
      ${renderSources(plan)}
      <p><strong>Ссылка на план:</strong> <a id="plan-link" href="${esc(url)}">${esc(url)}</a></p>
      <div class="actions">
        <button type="button" class="secondary" id="copy-link">Скопировать ссылку</button>
        <a class="secondary" href="${esc(url)}" style="text-decoration:none;display:inline-block">Открыть план</a>
      </div>
      <div id="copy-status" class="muted" aria-live="polite"></div>
    </div>`;
  $('result').classList.remove('hidden');
  $('copy-link').onclick = async () => {
    try { await navigator.clipboard.writeText(url); $('copy-status').textContent = 'Ссылка скопирована.'; }
    catch { $('copy-status').textContent = 'Не удалось скопировать автоматически. Скопируйте ссылку вручную.'; }
  };
}

$('plan-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  showError('form-error', '');
  $('result').classList.add('hidden');
  const req = Array.from(document.querySelectorAll('input[name="required_features"]:checked')).map(x=>x.value);
  const pref = Array.from(document.querySelectorAll('input[name="preferred_features"]:checked')).map(x=>x.value);
  const inter = req.filter(x=>pref.includes(x));
  if (inter.length) { showError('form-error', 'Обязательные признаки и предпочтения не должны пересекаться.'); return; }
  if (req.length > 5 || pref.length > 5) { showError('form-error', 'Не более 5 признаков в каждом списке.'); return; }
  const body = {
    event_id: $('event').value,
    date: $('date').value,
    meal_start: $('meal_start').value,
    meal_end: $('meal_end').value,
    required_features: req,
    preferred_features: pref,
    max_distance_m: Number($('max_distance_m').value)
  };
  setLoading(true);
  try {
    const r = await fetch('/api/evening/plans', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const data = await r.json().catch(()=>({}));
    if (!r.ok) {
      const msg = data?.detail?.message || data?.detail || `Ошибка ${r.status}`;
      showError('form-error', msg);
      return;
    }
    renderResult(data);
  } catch (err) {
    showError('form-error', 'Сетевая ошибка. Попробуйте ещё раз.');
  } finally {
    setLoading(false);
  }
});

renderFeatureChecks('required_features', 'required_features');
renderFeatureChecks('preferred_features', 'preferred_features');
loadEvents();
</script>
</body>
</html>
