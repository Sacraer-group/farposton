services:
  farposton:
    image: ${FARPOSTON_IMAGE:?set FARPOSTON_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FARPOSTON_BIND_PORT:-8445}:8445"
    environment:
      MAPGL_KEY: ${MAPGL_KEY:-}
      EVENING_DATA_MODE: real
      EVENING_CATALOG_DIR: /app/data/2gis/profiles-separated-v1
      EVENING_DB_PATH: /app/.demo/forecast/evening/plans.sqlite3
    volumes:
      - forecast-demo:/app/.demo/forecast
      - type: bind
        source: /home/tech/farposton/data/2gis
        target: /app/data/2gis
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /home/tech/farposton/.demo/venue-ensemble-extended-20261113-v1
        target: /app/.demo/venue-ensemble-extended-20261113-v1
        read_only: true
        bind:
          create_host_path: false
volumes:
  forecast-demo:
    external: true
    name: ${FARPOSTON_STATE_VOLUME:-farposton_forecast-demo}
