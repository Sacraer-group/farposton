{% macro contact(o, questions) -%}
<button type="button" class="button button-primary" data-contact-open data-contact-address="{{ o.address or 'Адрес не указан' }}" data-contact-offer="{{ o.source }}:{{ o.source_id }}" data-contact-questions="{{ questions|tojson|forceescape }}">Написать по квартире</button>
{%- endmacro %}
